services:
  - type: web
    name: hyper-personalized-ld-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0
    envVars:
      - key: GROQ_API_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.10.0
