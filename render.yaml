services:
  - type: web
    name: hyper-personalized-ai-ld-coach
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: HF_API_TOKEN_1
        sync: false
      - key: HF_API_TOKEN_2
        sync: false
      - key: HF_API_TOKEN_3
        sync: false
      - key: HF_API_TOKEN_4
        sync: false
      - key: HF_API_TOKEN_5
        sync: false
      - key: HF_API_TOKEN_6
        sync: false
      - key: HF_API_TOKEN_7
        sync: false
      - key: HF_API_TOKEN_8
        sync: false
